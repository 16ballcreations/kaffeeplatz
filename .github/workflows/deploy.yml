name: Publicar sitio

# GitHub Pages (16ballcreations.github.io/kaffeeplatz/) es el entorno de
# PRUEBAS. El sitio de produccion es kaffeeplatz.co, que vive en Cloudflare
# Workers y se publica aparte con `npm run deploy` — nunca desde aqui.
#
# Por eso este workflow tambien se puede lanzar a mano sobre cualquier rama:
# Actions -> Publicar sitio -> Run workflow -> elegir la rama. Asi se prueba
# una rama de trabajo sin mezclarla en main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rama:
        description: 'Rama a publicar en el entorno de pruebas'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Con workflow_dispatch, la rama elegida; si no, la que disparo el push.
          ref: ${{ github.event.inputs.rama || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # GitHub Pages sirve el repo bajo /kaffeeplatz, no en la raiz del dominio.
      # Cloudflare si lo sirve en la raiz, que es el valor por defecto de la
      # config: por eso aqui hay que pasar BASE_PATH explicitamente.
      - name: Construir
        env:
          SITE_URL: https://16ballcreations.github.io
          BASE_PATH: /kaffeeplatz
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
